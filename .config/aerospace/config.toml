# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Required under config-version = 2: the fallback is [] (v1 inferred these
# from the alt-1..alt-6 bindings). Keeps 1-6 alive for the sketchybar spaces items.
persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

# Launch Sketchybar
after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change
#exec-on-workspace-change = ['/bin/bash', '-c',
# '~/.config/aerospace/pip-move.sh && sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
#]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE && ~/.config/sketchybar/plugins/update_workspace_icons.sh && ~/.config/aerospace/pip-move.sh'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# Accordion is off: 0 disables the accordion padding feature, the root layout is
# 'tiles', and no binding switches a workspace into accordion.
accordion-padding = 0

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# [[on-window-detected]]
# if.app-id = 'com.apple.systempreferences'
# if.app-name-regex-substring = 'settings'
# if.window-title-regex-substring = 'substring'
# if.workspace = 'workspace-name'
# if.during-aerospace-startup = true
# check-further-callbacks = true
# run = ['layout floating', 'move-node-to-workspace S']  # The callback itself

# Floating windows

# Finder 
[[on-window-detected]]
if.app-name-regex-substring = 'finder'
check-further-callbacks = true
run = 'layout floating'

# PiP firefox
[[on-window-detected]]
if.window-title-regex-substring = 'Picture-In-Picture'
check-further-callbacks = true
run = 'layout floating'

# PiP Edge
[[on-window-detected]]
if.window-title-regex-substring = 'PictureInPicture'
check-further-callbacks = true
run = 'layout floating'

# Slack Huddle
[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
if.window-title-regex-substring = 'Huddle'
check-further-callbacks = true
run = 'layout floating'

# Superset — always tile on workspace 4
[[on-window-detected]]
if.app-name-regex-substring = 'Superset'
run = ['layout tiling', 'move-node-to-workspace 4']

# Proton Mail — always tile on workspace 3 (with Slack/Discord)
[[on-window-detected]]
if.app-id = 'ch.protonmail.desktop'
run = ['layout tiling', 'move-node-to-workspace 3']

# Popup terminal
[[on-window-detected]]
if.window-title-regex-substring = 'popup'
check-further-callbacks = true
run = 'layout floating'

# Catch-all: move any window detected on unknown workspaces to workspace 1
[[on-window-detected]]
if.workspace = 'S'
run = 'move-node-to-workspace 1'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     10
outer.top =        [{monitor.main = 20 }, 50] # Compensates the extra margin from the notch on macbooks
outer.right =      10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}


[workspace-to-monitor-force-assignment]
1 = "main"
2 = "main"
3 = "main"
4 = [2, "secondary"]
5 = [2, "secondary"]
6 = [2, "secondary"]

[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''


# Popup floating windows: open once, focus on repeat press. See
# ~/scripts/popup-kitty.sh. Titles are 'popup-term'/'popup-omp', both matched by
# the 'popup' on-window-detected rule below.
alt-t = 'exec-and-forget POPUP_DIR="$HOME" $HOME/scripts/popup-kitty.sh term'

alt-c = 'exec-and-forget $HOME/scripts/popup-kitty.sh omp zsh -ic omp'

# Key binding to run window layout cinfig from script
alt-s = 'exec-and-forget $HOME/.config/aerospace/run-aerospace-layout-manager.sh'

# Reload AeroSpace config
alt-shift-r = 'reload-config'

# Close the focused window. Sends the window's own close request, so unsaved
# work still prompts and close-to-tray apps just hide.
# See: https://nikitabobko.github.io/AeroSpace/commands#close
alt-w = 'close'

alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

